# Catatan: berkas ini ADA DI REPO KODE hanya sebagai sumber kebenaran yang
# ikut ter-review. Yang benar-benar berjalan adalah salinannya di repo PUBLIK
# `vibe-bars-exe` — `scripts/release.ps1` menyalinnya ke sana.
#
# Alurnya: rilis dibangun dan diverifikasi di mesin pengembang (gerbang rilis
# butuh sesi desktop untuk membuktikan jendelanya benar-benar muncul), lalu
# skrip mendorong aset + tag ke repo publik. Tag itu yang memicu workflow ini,
# dan workflow-lah yang membuat GitHub Release beserta catatan perubahannya.
#
# Kenapa lewat tag, bukan lewat API dari mesin lokal: `GITHUB_TOKEN` sudah
# tersedia sendiri di dalam Actions, jadi tidak perlu membuat, menyimpan, atau
# merotasi personal access token di mana pun.
name: Rilis

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  rilis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Siapkan catatan rilis
        id: catatan
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Catatan diambil dari `latest.json`, BUKAN dari CHANGELOG.md.
          #
          # Alasannya konkret: workflow ini berjalan di repo PUBLIK, dan repo
          # itu tidak punya CHANGELOG.md — berkas itu tinggal di repo kode.
          # Cabang fallback karena itu menyala di setiap rilis, dan halaman
          # rilis 0.2.0 sampai 0.4.0 sempat terbit dengan tulisan "catatan
          # perubahan belum ditulis" padahal catatannya ada.
          #
          # `latest.json` adalah sumber yang benar karena ia SUDAH memuat teks
          # yang sama: `scripts/release.ps1` mengambil bagian versi dari
          # CHANGELOG dan menaruhnya di sana untuk dibaca updater di dalam
          # aplikasi. Memakainya di sini membuat halaman rilis dan panel
          # Pembaruan menampilkan kalimat yang persis sama, dari satu sumber.
          # Diagnostik ditulis ke log DAN ikut menentukan cabang, supaya kalau
          # gagal lagi penyebabnya terbaca tanpa menebak. Pernah gagal senyap:
          # workflow melapor sukses sementara badan rilis tetap memakai teks
          # cadangan, dan tidak ada satu pun keluaran yang menjelaskan kenapa.
          if [ -f latest.json ]; then ada=ya; else ada=tidak; fi
          len=$(python3 -c "import json,sys;print(len(json.load(open('latest.json',encoding='utf-8')).get('notes') or ''))" 2>/dev/null || echo 0)
          echo "diagnostik: latest.json=$ada panjang_notes=$len"
          if [ "$ada" = "ya" ] && [ "$len" -gt 0 ]; then
            python3 -c "import json,io;io.open('CATATAN.md','w',encoding='utf-8').write(json.load(open('latest.json',encoding='utf-8'))['notes'])"
          else
            echo "Catatan perubahan belum ditulis untuk versi $ver. (latest.json=$ada, panjang=$len)" > CATATAN.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "### Unduh"
            echo ""
            echo "**[Vibe-Bars-Setup.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Vibe-Bars-Setup.exe)** — pemasangan per-pengguna, tanpa hak administrator."
            echo ""
            echo '```'
            echo "SHA-256  $(sha256sum Vibe-Bars-Setup.exe | cut -d' ' -f1 | tr 'a-f' 'A-F')"
            echo '```'
            echo ""
            echo "Sudah memakai Vibe Bars? Tidak perlu mengunduh apa pun — buka **Pengaturan → Pembaruan** di dalam aplikasi."
            echo ""
            echo "Installer belum ditandatangani secara digital, jadi Windows SmartScreen akan menampilkan peringatan. Klik **More info** lalu **Run anyway**. Cocokkan checksum di atas kalau ingin memastikan berkasnya utuh."
          } >> CATATAN.md
          echo "versi=$ver" >> "$GITHUB_OUTPUT"

      # Rilis lama dibuang dulu supaya yang baru benar-benar dibuat ulang.
      #
      # Ini bukan kehati-hatian berlebihan, melainkan perbaikan atas kegagalan
      # nyata: `softprops/action-gh-release` MENGUNGGAH ULANG aset ke rilis yang
      # sudah ada, tapi **tidak menyentuh badan rilisnya**. Akibatnya halaman
      # rilis yang terlanjur terbit dengan teks salah tidak bisa diperbaiki
      # dengan menjalankan ulang workflow — dan gagalnya senyap, karena
      # workflow tetap melapor sukses.
      #
      # Dibuktikan begini: teks diagnostik ditambahkan ke pesan cadangan, tag
      # dipindah ke commit yang benar, workflow jalan dan sukses — badan rilis
      # tidak berubah satu karakter pun (tetap 635 byte, tanpa teks baru itu).
      #
      # `gh` sudah terpasang di runner dan `GITHUB_TOKEN` sudah punya izin
      # tulis, jadi tidak ada kredensial pribadi yang perlu dititipkan ke mana
      # pun. Tag sengaja DIPERTAHANKAN (`gh release delete` tidak menghapus tag
      # tanpa `--cleanup-tag`) supaya riwayat versinya utuh.
      #
      # Efek samping yang diterima: selama beberapa detik antara penghapusan
      # dan pembuatan ulang, URL unduhan menjadi 404. Updater di dalam aplikasi
      # hanya akan menganggap pemeriksaan gagal dan mencoba lagi nanti.
      - name: Hapus rilis lama kalau ada
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
            echo "rilis lama $GITHUB_REF_NAME dihapus; tag dipertahankan"
          else
            echo "belum ada rilis $GITHUB_REF_NAME, tidak ada yang perlu dihapus"
          fi

      - name: Terbitkan
        uses: softprops/action-gh-release@v2
        with:
          name: Vibe Bars ${{ steps.catatan.outputs.versi }}
          body_path: CATATAN.md
          # latest.json WAJIB ikut: itulah yang dibaca updater di dalam
          # aplikasi lewat URL .../releases/latest/download/latest.json
          files: |
            Vibe-Bars-Setup.exe
            Vibe-Bars-Setup.exe.sha256
            latest.json
